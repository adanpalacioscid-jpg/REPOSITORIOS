<!DOCTYPE html>

    <title>ABSOLUTE-HOSTINGER</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>

        <div class="logo-icon">
            <i class="bi bi-perplexity"></i>

        <div class="Agente">
