<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIXED-DEEPSEEK</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header>
        <div class="header-title">
            <span class="title-text">Hi. What can I do for you?</span>
        </div>
    </header>

    <main class="buscador">
        
        <textarea 
            class="cuadro" 
            name="texto" 
            id="texto" 
            placeholder="Message DeepSeek" 
            rows="2"
        ></textarea>

        <div class="bottom-izquierda">
            <div class="btn-izq">
                <button type="button" class="chip-btn">⚛ DeepThink</button>
                <button type="button" class="chip-btn">🌐 Search</button>
            </div>

            <div class="logo-container">
                <button type="button" class="icon-btn">📎</button>
                <button type="button" class="send-btn">↑</button>
            </div>
        </div>

    </main>

</body>
</html>
