<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULARIO DE TAREA</title>
</head>
<body>
        <form>
            <div>
                <img src="./assets.html/imagen/form-tarea.png" alt="Imagen de tarea">
            </div>
        <h1>My feedback form</h1>
            <div>
                <label for="nombre">Name</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="lopezlopez"
                    maxlength="15"
                    minlength="10"
                    required>
            </div>
       
            <div>
                <label for="email">Email</label>
                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="lopezlopez123@gmail.com"
                    required>   
            </div>
       
            <div>
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password">
            </div>
        
            <div>
                <span>Please check all the emotions that apply to you:</span>
            </div>
        
            <div>
                <label for="Angry">Angry</label>
                <input
                    type="checkbox"
                    id="Angry"
                    name="all_emotions">
            </div>
            <div>
                <label for="Sad">Sad</label>
                <input
                    type="checkbox"
                    id="Sad"
                    name="all_emotions">
            </div>
            <div>
                <label for="Happy">Happy</label>
                <input
                    type="checkbox"
                    id="Happy"
                    name="all_emotions">
            </div>
            <div>
                <label for="Ambivalent">Ambivalent</label>
                <input
                    type="checkbox"
                    id="Ambivalent"
                    name="all_emotions">
            </div>
        
            <div>
                <span>How satisfied were you with our service<span>
            </div>
        
            <div>
                <label for="Very-Satisfied">Very Satisfied</label>
                <input
                    type="radio"
                    id="Very-Satisfied"
                    name="emotion">
            </div>
            <div>
                <label for="Very-dissatisfied">Very dissatisfied</label>
                <input
                    type="radio"
                    id="Very-dissatisfied"
                    name="emotion">
            </div>
            <div>
                <label for="No opinion">No opinion</label>
                <input
                    type="radio"
                    id="No opinion"
                    name="emotion">
            </div>
      
            <div>
                <label for="comment">Further comments</label>
                <textarea 
                    name="comment" 
                    id="comment" 
                    placeholder="comments here..." 
                    rows="10" cols="30" 
                    maxlength="300">
                </textarea>    
            </div>
        
            <div>
                <label for="docs">Bio photo</label>
                <input
                    type="file"
                    name="docs"
                    id="docs">
            </div>
        
            <div>
                <label for="location">Location visited</label>
                <select id="location" name="location">
                    <option value="AR">ARGENTINA</option>
                    <option value="BR">BRASIL</option>
                    <option value="CH">CHILE</option>
                    <option value="UR">URUGUAY</option>
                </select>
            </div>
   
            <div>
                <button type="submit">SUBMIT</button>
            </div>
    </form>
</body>
</html>
